<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Charte IA — processus éditorial CFO</title>
  <desc id="desc">Synoptique du processus de création éditoriale de CFO et de la place de l'intelligence artificielle.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf8}.ink{fill:#252525}.muted{fill:#6d6d6d}.brick{fill:#8d2f2f}.warm{fill:#b78363}.line{stroke:#cdb9ab;stroke-width:2;fill:none}.arrow{stroke:#8d2f2f;stroke-width:2.4;fill:none;marker-end:url(#m)}
      .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,Helvetica,sans-serif}.caps{letter-spacing:2.4px}.smallcaps{letter-spacing:1.5px}
      .card{fill:#fff;stroke:#e8dfd8;stroke-width:1.5}.tag{fill:#f2e8e1}.tag2{fill:#ecebea}.tag3{fill:#f7f4f1}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d2f2f"/></marker>
  </defs>
  <rect class="bg" width="1536" height="1024"/>

  <text x="120" y="92" class="sans caps brick" font-size="18" font-weight="700">CFO · CHARTE IA</text>
  <text x="120" y="145" class="serif ink" font-size="46" font-weight="700">Comment naît un contenu CFO</text>
  <text x="120" y="183" class="sans muted" font-size="21">L’IA peut assister le processus. Le regard, l’arbitrage et la responsabilité restent humains.</text>
  <line x1="120" y1="214" x2="1416" y2="214" class="line"/>

  <!-- workflow cards -->
  <g class="sans">
    <g transform="translate(120,268)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="brick"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Signal</text><text x="24" y="111" class="muted" font-size="16">Repérer un fait, une</text><text x="24" y="133" class="muted" font-size="16">question ou une donnée.</text></g>
    <g transform="translate(386,268)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="brick"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Angle éditorial</text><text x="24" y="111" class="muted" font-size="16">Choisir le sujet et le</text><text x="24" y="133" class="muted" font-size="16">regard porté dessus.</text></g>
    <g transform="translate(652,268)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="brick"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Documentation</text><text x="24" y="111" class="muted" font-size="16">Remonter aux sources</text><text x="24" y="133" class="muted" font-size="16">identifiables.</text></g>
    <g transform="translate(918,268)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="brick"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Analyse</text><text x="24" y="111" class="muted" font-size="16">Croiser faits, données</text><text x="24" y="133" class="muted" font-size="16">et contexte.</text></g>
    <g transform="translate(1184,268)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="brick"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">5</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Création</text><text x="24" y="111" class="muted" font-size="16">Écrire, structurer,</text><text x="24" y="133" class="muted" font-size="16">illustrer.</text></g>

    <path d="M350 343 H380" class="arrow"/><path d="M616 343 H646" class="arrow"/><path d="M882 343 H912" class="arrow"/><path d="M1148 343 H1178" class="arrow"/>

    <g transform="translate(252,462)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="warm"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">6</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Vérification</text><text x="24" y="111" class="muted" font-size="16">Contrôler faits, dates,</text><text x="24" y="133" class="muted" font-size="16">citations et liens.</text></g>
    <g transform="translate(518,462)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="warm"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">7</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Validation</text><text x="24" y="111" class="muted" font-size="16">Arbitrage et décision</text><text x="24" y="133" class="muted" font-size="16">exclusivement humains.</text></g>
    <g transform="translate(784,462)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="warm"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">8</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Publication</text><text x="24" y="111" class="muted" font-size="16">Publier et assumer le</text><text x="24" y="133" class="muted" font-size="16">contenu éditorial.</text></g>
    <g transform="translate(1050,462)"><rect class="card" rx="18" width="230" height="150"/><circle cx="38" cy="38" r="22" class="warm"/><text x="38" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">9</text><text x="24" y="83" class="ink" font-size="20" font-weight="700">Suivi</text><text x="24" y="111" class="muted" font-size="16">Corriger, enrichir et</text><text x="24" y="133" class="muted" font-size="16">actualiser si nécessaire.</text></g>
    <path d="M482 537 H512" class="arrow"/><path d="M748 537 H778" class="arrow"/><path d="M1014 537 H1044" class="arrow"/>
  </g>

  <!-- responsibility matrix -->
  <text x="120" y="684" class="sans smallcaps muted" font-size="16" font-weight="700">QUI FAIT QUOI ?</text>
  <g class="sans" transform="translate(120,712)">
    <rect width="1296" height="190" rx="18" class="card"/>
    <rect x="0" y="0" width="1296" height="56" rx="18" class="tag3"/>
    <text x="32" y="35" class="ink" font-size="16" font-weight="700">Étape</text><text x="265" y="35" class="ink" font-size="16" font-weight="700">CFO / humain</text><text x="690" y="35" class="ink" font-size="16" font-weight="700">IA</text><text x="1010" y="35" class="ink" font-size="16" font-weight="700">Contrôle</text>
    <line x1="0" y1="56" x2="1296" y2="56" class="line"/>
    <text x="32" y="92" class="brick" font-size="16" font-weight="700">Recherche & analyse</text><text x="265" y="92" class="ink" font-size="16">Choisit l’angle, interprète, arbitre</text><text x="690" y="92" class="muted" font-size="16">Explore, rapproche, synthétise</text><text x="1010" y="92" class="ink" font-size="16">Sources identifiables</text>
    <line x1="24" y1="112" x2="1272" y2="112" class="line"/>
    <text x="32" y="146" class="brick" font-size="16" font-weight="700">Création & publication</text><text x="265" y="146" class="ink" font-size="16">Écrit, valide et assume</text><text x="690" y="146" class="muted" font-size="16">Assiste la forme et les traitements</text><text x="1010" y="146" class="ink" font-size="16">Validation humaine</text>
  </g>

  <text x="768" y="958" text-anchor="middle" class="serif brick" font-size="26" font-weight="700">L’IA intervient dans le processus. Elle ne possède jamais le processus.</text>
  <text x="768" y="988" text-anchor="middle" class="sans muted" font-size="15">CFO — transparence sur l’usage de l’intelligence artificielle</text>
</svg>